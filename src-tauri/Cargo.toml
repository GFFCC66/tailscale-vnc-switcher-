[package]
name = "vnc-switcher"
version = "0.1.0"
description = "把多台 Tailscale 云桌面集中到一个窗口里切换"
authors = ["GFFCC66"]
edition = "2021"

[lib]
# `_lib` 后缀是为了避免 Windows 上库名和可执行文件名冲突。
name = "vnc_switcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "rt", "rt-multi-thread", "time", "sync", "macros", "io-util"] }
tokio-tungstenite = { version = "0.26", features = ["connect"] }
futures-util = "0.3"
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"

[dev-dependencies]
tempfile = "3"
futures-util = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
